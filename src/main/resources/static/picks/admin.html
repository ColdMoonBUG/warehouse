<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#1890ff">
  <title>艳萍麻花 · 商品图片管理</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="admin-body">
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>商品图片管理</h1>
      <p class="login-hint">请输入管理密码</p>
      <label class="login-field">
        <span>密码</span>
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="管理密码">
      </label>
      <button id="loginBtn" class="btn btn-primary btn-block">进入</button>
      <div id="loginError" class="login-error" hidden></div>
      <a class="view-link" href="./viewer.html">← 回到选品页</a>
    </div>
  </div>

  <div id="appScreen" class="admin-screen" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-dot admin-dot"></span>
          <span class="brand-name">商品图片管理</span>
        </div>
        <div class="topbar-actions">
          <input id="searchInput" type="search" placeholder="搜索商品/条码">
          <a class="admin-link ghost" href="./viewer.html">展示页</a>
          <button id="logoutBtn" class="admin-link ghost">退出</button>
        </div>
      </div>
    </header>

    <div id="status" class="status-line">正在加载商品...</div>
    <div id="grid" class="card-grid admin-grid"></div>
    <div id="empty" class="empty" hidden>未找到商品</div>

    <input id="fileInput" type="file" accept="image/*" capture="environment" hidden>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="./app.js?v=1"></script>
  <script>bootAdmin()</script>
</body>
</html>
