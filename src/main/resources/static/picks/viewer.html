<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
  <meta name="theme-color" content="#c34a36">
  <title>艳萍麻花 · 在线选品</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">艳萍麻花 · 在线选品</span>
      </div>
      <div class="topbar-actions">
        <input id="searchInput" type="search" placeholder="搜索商品/条码" autocomplete="off">
        <a class="admin-link" href="./admin.html" title="管理员">管理</a>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="status" class="status-line">正在加载商品...</div>
    <div id="grid" class="card-grid"></div>
    <div id="empty" class="empty" hidden>未找到商品</div>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-backdrop" data-close></div>
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="">
      <button class="lightbox-close" data-close>×</button>
    </div>
  </div>

  <script src="./app.js?v=1"></script>
  <script>bootViewer()</script>
</body>
</html>
